<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đọa Sinh Luân</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #e94560;
            font-size: 2.5em;
            margin: 30px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .chapter-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
        }
        .chapter-btn {
            padding: 12px 20px;
            background: linear-gradient(145deg, #0f3460, #16213e);
            color: #fff;
            border: 2px solid #e94560;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }
        .chapter-btn:hover {
            background: #e94560;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233,69,96,0.4);
        }
        .chapter-btn.active {
            background: #e94560;
            box-shadow: 0 0 20px rgba(233,69,96,0.5);
        }
        .content-area {
            background: rgba(255,255,255,0.95);
            color: #333;
            padding: 40px;
            border-radius: 15px;
            line-height: 1.8;
            font-size: 1.1em;
            min-height: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .chapter-title {
            text-align: center;
            color: #e94560;
            font-size: 2em;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 3px solid #e94560;
        }
        .novel-content {
            text-align: justify;
            white-space: pre-wrap;
            font-family: 'Times New Roman', serif;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 10px;
        }
        .nav-btn {
            padding: 10px 25px;
            background: #0f3460;
            color: #fff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }
        .nav-btn:hover {
            background: #e94560;
        }
        .nav-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Đọa Sinh Luân</h1>
        
        <div class="chapter-nav" id="chapterNav"></div>
        
        <div class="content-area">
            <h2 class="chapter-title" id="chapterTitle">Đang tải...</h2>
            <div class="novel-content" id="novelContent"></div>
            <div class="nav-buttons">
                <button class="nav-btn" id="prevBtn" onclick="prevChapter()">Chap trước</button>
                <button class="nav-btn" id="nextBtn" onclick="nextChapter()">Chap sau</button>
            </div>
        </div>
    </div>

    <script>
        // Danh sách file trong folder 0-10
        const chapterFiles = [
            '0-10/0.txt',
            '0-10/1.txt',
            '0-10/2.txt',
            '0-10/3.txt',
            '0-10/4.txt',
            '0-10/5.txt',
            '0-10/6.txt',
            '0-10/7.txt',
            '0-10/8.txt'
        ];

        let chapters = [];
        let currentChapter = 0;

        // Đọc tiêu đề từ dòng đầu file (tìm -- Tiêu đề --)
        function extractTitle(content) {
            const lines = content.split('\n');
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                // Dạng --Tiêu đề-- hoặc -- Tiêu đề --
                const match = line.match(/^--\s*(.+?)\s*--$/);
                if (match) return match[1];
                // Dạng Chap X — Tiêu đề
                const match2 = line.match(/^Chap\s*\d+\s*[—\-]+\s*(.+)$/i);
                if (match2) return match2[1];
            }
            return null;
        }

        // Xóa dòng tiêu đề khỏi nội dung
        function removeTitle(content) {
            const lines = content.split('\n');
            while (lines.length > 0 && lines[0].trim() === '') lines.shift();
            if (lines.length > 0) {
                const line = lines[0].trim();
                if (line.match(/^--.*--$/) || line.match(/^Chap\s*\d+\s*[—\-]/i)) {
                    lines.shift();
                    while (lines.length > 0 && lines[0].trim() === '') lines.shift();
                }
            }
            return lines.join('\n').trim();
        }

        async function init() {
            // Tải tất cả file để lấy tiêu đề
            for (let i = 0; i < chapterFiles.length; i++) {
                try {
                    const response = await fetch(chapterFiles[i]);
                    const content = await response.text();
                    const title = extractTitle(content) || ('Chương ' + (i + 1));
                    chapters.push({ file: chapterFiles[i], title: title, content: content });
                } catch (e) {
                    chapters.push({ file: chapterFiles[i], title: 'Chương ' + (i + 1), content: '' });
                }
            }
            createNavButtons();
            loadChapter(0);
        }

        function loadChapter(index) {
            if (index < 0 || index >= chapters.length) return;
            
            currentChapter = index;
            const chapter = chapters[index];
            
            document.getElementById('chapterTitle').textContent = 'Chap ' + index + ' (' + chapter.title + ')';
            
            // Cuộn lên đầu trang
            window.scrollTo(0, 0);
            
            const content = removeTitle(chapter.content);
            document.getElementById('novelContent').textContent = content || 'Chưa có nội dung.';
            
            // Cập nhật nút
            document.getElementById('prevBtn').disabled = currentChapter === 0;
            document.getElementById('nextBtn').disabled = currentChapter === chapters.length - 1;
            
            // Cập nhật nút active
            document.querySelectorAll('.chapter-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === currentChapter);
            });
        }

        function prevChapter() {
            loadChapter(currentChapter - 1);
        }

        function nextChapter() {
            loadChapter(currentChapter + 1);
        }

        function createNavButtons() {
            const nav = document.getElementById('chapterNav');
            chapters.forEach((chapter, index) => {
                const btn = document.createElement('button');
                btn.className = 'chapter-btn';
                btn.textContent = 'Chap ' + index;
                btn.onclick = () => loadChapter(index);
                nav.appendChild(btn);
            });
        }

        // Khởi tạo
        init();
    </script>
</body>
</html>
