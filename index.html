<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiểu Thuyết - 0-10</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #e94560;
            font-size: 2.5em;
            margin: 30px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .chapter-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
        }
        .chapter-btn {
            padding: 12px 20px;
            background: linear-gradient(145deg, #0f3460, #16213e);
            color: #fff;
            border: 2px solid #e94560;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }
        .chapter-btn:hover {
            background: #e94560;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233,69,96,0.4);
        }
        .chapter-btn.active {
            background: #e94560;
            box-shadow: 0 0 20px rgba(233,69,96,0.5);
        }
        .content-area {
            background: rgba(255,255,255,0.95);
            color: #333;
            padding: 40px;
            border-radius: 15px;
            line-height: 1.8;
            font-size: 1.1em;
            min-height: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .chapter-title {
            text-align: center;
            color: #e94560;
            font-size: 2em;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 3px solid #e94560;
        }
        .novel-content {
            text-align: justify;
            white-space: pre-wrap;
            font-family: 'Times New Roman', serif;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 10px;
        }
        .nav-btn {
            padding: 10px 25px;
            background: #0f3460;
            color: #fff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }
        .nav-btn:hover {
            background: #e94560;
        }
        .nav-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tiểu Thuyết 0-10</h1>
        
        <div class="chapter-nav" id="chapterNav"></div>
        
        <div class="content-area">
            <h2 class="chapter-title" id="chapterTitle">Đang tải...</h2>
            <div class="novel-content" id="novelContent"></div>
            <div class="nav-buttons">
                <button class="nav-btn" id="prevBtn" onclick="prevChapter()">Chap trước</button>
                <button class="nav-btn" id="nextBtn" onclick="nextChapter()">Chap sau</button>
            </div>
        </div>
    </div>

    <script>
        const chapters = [
            { file: '0-10/0.txt', title: 'Ngoại Giới' },
            { file: '0-10/1.txt', title: 'Dị Nhân' },
            { file: '0-10/2.txt', title: 'Khởi Hành' },
            { file: '0-10/3.txt', title: 'Quỷ Khoáng' },
            { file: '0-10/4.txt', title: 'Thứ Dưới Đáy Mỏ' },
            { file: '0-10/5.txt', title: 'Khe Hở' },
            { file: '0-10/6.txt', title: 'Ngoại Quy' },
            { file: '0-10/7.txt', title: 'Kẻ Bị Thần Bỏ Rơi' }
        ];
        
        let currentChapter = 0;

        async function loadChapter(index) {
            if (index < 0 || index >= chapters.length) return;
            
            currentChapter = index;
            const chapter = chapters[index];
            
            document.getElementById('chapterTitle').textContent = 'Chap ' + (index + 1) + ' (' + chapter.title + ')';
            document.getElementById('novelContent').textContent = 'Đang tải nội dung...';
            
            try {
                const response = await fetch(chapter.file);
                let content = await response.text();
                
                // Xóa dòng tiêu đề trong nội dung
                const lines = content.split('\n');
                while (lines.length > 0 && lines[0].trim() === '') lines.shift();
                if (lines.length > 0 && (lines[0].trim().startsWith('--') || lines[0].trim().startsWith('Chap '))) {
                    lines.shift();
                    while (lines.length > 0 && lines[0].trim() === '') lines.shift();
                }
                content = lines.join('\n').trim();
                
                document.getElementById('novelContent').textContent = content;
            } catch (error) {
                document.getElementById('novelContent').textContent = 'Lỗi khi tải chương này.';
            }
            
            // Cập nhật nút
            document.getElementById('prevBtn').disabled = currentChapter === 0;
            document.getElementById('nextBtn').disabled = currentChapter === chapters.length - 1;
            
            // Cập nhật nút active
            document.querySelectorAll('.chapter-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === currentChapter);
            });
        }

        function prevChapter() {
            loadChapter(currentChapter - 1);
        }

        function nextChapter() {
            loadChapter(currentChapter + 1);
        }

        function createNavButtons() {
            const nav = document.getElementById('chapterNav');
            chapters.forEach((chapter, index) => {
                const btn = document.createElement('button');
                btn.className = 'chapter-btn';
                btn.textContent = 'Chap ' + (index + 1);
                btn.onclick = () => loadChapter(index);
                nav.appendChild(btn);
            });
        }

        // Khởi tạo
        createNavButtons();
        loadChapter(0);
    </script>
</body>
</html>
